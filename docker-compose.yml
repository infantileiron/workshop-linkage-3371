name: workshop-linkage
x-app: &app
  build: ./backend
  environment: &env
    DATABASE_URL: postgresql+psycopg://workshop:${DB_PASSWORD:-workshop_local_demo}@db:5432/workshop
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-workshop-local-development-secret-change-32-chars}
    SEED_DEMO: ${SEED_DEMO:-true}
  volumes: [artifacts:/artifacts]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-workshop-linkage}-db
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workshop_local_demo}
      POSTGRES_DB: workshop
    ports: ["127.0.0.1:${DB_PORT:-17776}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workshop -d workshop"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-workshop-linkage}-redis
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-workshop-linkage}-backend
    ports: ["127.0.0.1:${BACKEND_PORT:-19276}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-workshop-linkage}-worker
    command: [python, -m, src.worker]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/worker-heartbeat')<20"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-workshop-linkage}-frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-18276}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  dbdata:
  redisdata:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.221.207.0/24}
